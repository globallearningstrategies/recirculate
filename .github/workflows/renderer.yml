name: Linux video renderer
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: node node_modules/ffmpeg-static/install.js
      - run: node scripts/verify-renderer.cjs
